spring:
  application:
    name: testforge-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testforge}
    username: ${DB_USERNAME:testforge_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

testforge:
  automation:
    execution:
      timeout-seconds: 120
      browser-install-timeout-seconds: 300


